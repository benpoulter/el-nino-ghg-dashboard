name: Refresh dashboard data
on:
  schedule: [{cron: '0 6 * * 1'}]   # Mondays 06:00 UTC
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CDSE_S3_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDSE_S3_SECRET }}
      AWS_S3_ENDPOINT: eodata.dataspace.copernicus.eu
      AWS_VIRTUAL_HOSTING: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pillow netCDF4 rasterio boto3 requests icoscp_core
      - run: bash build/run_all.sh
      - run: |
          git config user.name "dashboard-bot" && git config user.email "bot@users.noreply.github.com"
          git add index.html && git commit -m "Data refresh $(date -u +%F)" && git push
