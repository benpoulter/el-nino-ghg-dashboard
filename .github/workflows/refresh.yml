name: Refresh dashboard data
on:
  schedule: [{cron: '0 6 * * 1'}]   # Mondays 06:00 UTC
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CDSE_S3_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDSE_S3_SECRET }}
      AWS_S3_ENDPOINT: eodata.dataspace.copernicus.eu
      AWS_VIRTUAL_HOSTING: "FALSE"
      BUILD_BUDGET_MIN: "240"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/data
            build/geoscf
            build/airs
            build/firesm
            build/ndvi_hi
          key: dashboard-data-${{ github.run_id }}
          restore-keys: dashboard-data-
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin libgdal-dev
      - run: pip install numpy pillow netCDF4 rasterio boto3 requests icoscp_core playwright && python -m playwright install --with-deps chromium
      - run: bash build/run_all.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            build/data
            build/geoscf
            build/airs
            build/firesm
            build/ndvi_hi
          key: dashboard-data-${{ github.run_id }}
      - run: |
          git config user.name "dashboard-bot" && git config user.email "bot@users.noreply.github.com"
          git add index.html dashboard-single.html data && git commit -m "Data refresh $(date -u +%F)" && git push
