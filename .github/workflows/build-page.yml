name: Build page
# Rebuilds the published page whenever the page code (src/page.html) or a hand-maintained site list changes.
on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:
concurrency: {group: dashboard-data, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash build/fetch_site.sh   # the published data live on the gh-pages branch
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy pillow requests playwright && python -m playwright install --with-deps chromium
      - run: STEPS="compose test split" bash build/run_all.sh
      - run: bash build/publish.sh
